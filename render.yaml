services:
  - type: web
    name: meeting-translator
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # All optional — with none set the app runs fully on the built-in mock
      # STT + mock analysis providers (zero cost, zero signup). Fill these in
      # via the Render dashboard once you want real transcription/translation.
      - key: AMIVOICE_API_KEY
        sync: false
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional Firestore persistence — set all three, or leave unset to
      # keep the current in-memory-only behavior. See .env.example.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Optional access gate — set this once real STT/Gemini billing is on
      # the line, so a stranger who finds the URL can't spend it. Unset =
      # fully public, same as today.
      - key: APP_PASSWORD
        sync: false
